<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Teacher's Daily Planner</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="css/styles.css?v=7.8" />
    <!-- Intro.js Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/introjs.min.css" />
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.error('SW registration failed', err));
            });
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('darkMode', isDark);
            const btns = document.querySelectorAll('button[onclick="toggleDarkMode()"]');
            btns.forEach(btn => btn.textContent = isDark ? '☀️' : '🌙');
        }
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            setTimeout(() => {
                const btns = document.querySelectorAll('button[onclick="toggleDarkMode()"]');
                btns.forEach(btn => btn.textContent = '☀️');
            }, 0);
        }
    </script>
</head>

<body>

    <!-- ====== TOAST CONTAINER ====== -->
    <div id="toast-container"></div>

    <!-- ====== SCHOOL CODE OVERLAY ====== -->
    <div id="school-code-overlay" class="auth-overlay">
        <div class="auth-card">
            <span class="auth-logo">🏫</span>
            <h2 class="auth-title">School Connect</h2>
            <p class="auth-subtitle">Enter your school code to continue</p>

            <form onsubmit="handleSchoolCodeSubmit(event)">
                <div class="auth-form-group">
                    <label for="school-code-input">School Code</label>
                    <input type="text" id="school-code-input" required placeholder="e.g. ABC123" autocomplete="off" style="text-transform: uppercase;" />
                    <div id="school-code-error" class="error-msg" style="display:none; color:#ef4444; font-size:13px; margin-top:8px;"></div>
                </div>
                <button type="submit" class="auth-btn-submit" id="school-code-submit-btn">Connect</button>
            </form>
        </div>
    </div>

    <!-- ====== LANDING PAGE ====== -->
    <div id="landing-page" class="landing-page">
        <div class="landing-login">
            <h1 class="landing-title">Teacher's Daily Planner</h1>
            <button type="button" class="landing-google-btn" onclick="openLoginFlow('login')" aria-label="Sign in">
                <span>Sign in</span>
            </button>
        </div>
    </div>



    <!-- ====== FETCH CONFIG OVERLAY ====== -->
    <div id="config-fetch-overlay" class="auth-overlay">
        <div class="auth-card">
            <span class="auth-logo">🔑</span>
            <h2 class="auth-title">Fetch Supabase Config</h2>
            <p class="auth-subtitle">Enter credentials to fetch your configuration</p>
            
            <form id="config-fetch-form" onsubmit="event.preventDefault(); document.getElementById('submitFetchConfigBtn').click();">
                <div class="auth-form-group">
                    <label for="fetchConfigUuid">UUID (Optional)</label>
                    <input type="text" id="fetchConfigUuid" placeholder="e.g. 123e4567-e89b-12d3-a456-426614174000" autocomplete="off" />
                </div>
                
                <div class="auth-form-group">
                    <label for="fetchConfigPin">PIN (Required)</label>
                    <input type="password" id="fetchConfigPin" placeholder="Enter PIN" autocomplete="current-password" />
                </div>
            </form>
            
            <div style="display:flex;gap:12px;margin-top:28px;">
                <button class="btn btn-outline" id="cancelFetchConfigBtn" style="flex:1;">Cancel</button>
                <button class="btn btn-primary" id="submitFetchConfigBtn" style="flex:1;">Submit</button>
            </div>
        </div>
    </div>

    <!-- Intro.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/intro.min.js" defer></script>

    <script src="js/boot.js" defer></script>
    <script src="js/data.js?v=7.6" defer></script>
    <script src="js/toast.js?v=7.6" defer></script>
    <script src="js/env.js" defer></script>
    <script src="js/supabase.js?v=7.6" defer></script>
    <script src="js/storage-manager.js?v=7.6" defer></script>
    <script src="js/api.js?v=7.6" defer></script>
    <script src="js/auth.js?v=7.6" defer></script>
    <script>
        function runAuthSetup() {
            if (typeof setupAuthListener === 'function') {
                setupAuthListener();
            }
        }
        if (typeof window.onAppReady === 'function') {
            window.onAppReady(runAuthSetup);
        } else {
            window.addEventListener('appReady', runAuthSetup);
        }
    </script>

    <!-- ====== AUTH OVERLAY ====== -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <span class="auth-logo">🔐</span>
            <h2 class="auth-title">Teacher Planner Sync</h2>
            <p class="auth-school-subtitle" style="font-size: 14px; margin-bottom: 12px; font-weight: 500;">
                <span id="auth-school-name"></span>
                <a href="#" onclick="changeSchool(); return false;" style="color: var(--primary-color); text-decoration: none; margin-left: 8px; font-size: 13px;">[Change School]</a>
            </p>

            <div id="auth-alert" class="auth-alert" style="display:none; margin-bottom: 16px; padding: 12px; border-radius: 6px; font-size: 14px;"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login-btn" type="button">Sign In</button>
            </div>

            <!-- Login / Signup Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="auth-form-group">
                    <label for="auth-email">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="name@school.com" />
                </div>
                <div class="auth-form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" autocomplete="current-password" />
                </div>
                <button type="submit" class="auth-btn-submit" id="auth-submit-btn">Sign In</button>
            </form>

            <p style="margin-top:16px;font-size:12px;color:#64748b;text-align:center;">Accounts are created by your principal or administrator. Forgot your password? Ask them to reset it.</p>
        </div>
    </div>


</body>

</html>
